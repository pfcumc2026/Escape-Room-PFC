<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Placeholder</title>
<script>try{document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('ph-theme')||'dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="ph-loading">

<div class="ph-loader">Carregando…</div>

<header class="ph-top">
  <button type="button" class="ph-theme-toggle" data-ph-theme-toggle aria-label="Alternar tema"></button>
  <a class="ph-brand" href="index.html">
    <span class="ph-logo"><i data-lucide="door-open" aria-hidden="true"></i></span>
    Placeholder <small>Escape Room</small>
  </a>
</header>

<main class="ph-shell ph-shell--narrow ph-page">
  <div class="ph-hint-mobile">Para a melhor experiência, use o computador ou gire o celular na horizontal.</div>

  <section class="ph-card ph-card--accent">
    <p class="ph-eyebrow">Acesso</p>
    <h1 class="ph-title">Entrar na sua conta</h1>
    <p class="ph-sub">Use seu e-mail e senha ou a sua conta Google.</p>

    <hr class="ph-sep">

    <form id="form-login" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control" type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="senha">Senha</label>
        <input class="form-control" type="password" id="senha" name="senha" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit" id="btn-entrar">Entrar</button>
    </form>

    <div id="bloco-2fa" class="mt-3 d-none">
      <hr class="ph-sep">
      <p class="ph-eyebrow">Verificação em duas etapas</p>
      <label class="form-label" for="codigo-2fa">Código do aplicativo autenticador</label>
      <div class="d-flex gap-2">
        <input class="form-control ph-mono" id="codigo-2fa" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
        <button class="btn btn-primary" type="button" id="btn-2fa">Confirmar</button>
      </div>
    </div>

    <div class="d-flex align-items-center gap-2 my-3">
      <hr class="flex-grow-1 ph-sep m-0">
      <span class="ph-muted" style="font-size:.78rem">ou</span>
      <hr class="flex-grow-1 ph-sep m-0">
    </div>

    <button class="btn btn-outline-secondary w-100 d-inline-flex align-items-center justify-content-center gap-2" type="button" id="btn-google">
      <i data-lucide="log-in" aria-hidden="true"></i> Continuar com o Google
    </button>

    <hr class="ph-sep">

    <div class="d-flex justify-content-between flex-wrap gap-2" style="font-size:.88rem">
      <a href="esqueci-senha.html">Esqueci minha senha</a>
      <a href="cadastro.html">Criar uma conta</a>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script type="module" src="js/login.js"></script>
</body>
</html>
