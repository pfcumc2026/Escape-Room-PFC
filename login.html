<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Escape.py</title>
<script>try{document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('ph-theme')||'dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="ph-loading" data-pagina="login">

<div class="ph-loader">Carregando…</div>

<header class="ph-top">
  <button type="button" class="ph-theme-toggle" data-ph-theme-toggle aria-label="Alternar tema"></button>
  <a class="ph-brand" href="index.html">
    <span class="ph-logo"><i data-lucide="door-open" aria-hidden="true"></i></span>
    Escape.py <small>Escape Room</small>
  </a>
</header>

<main class="ph-shell ph-shell--narrow ph-page">
  <div class="ph-hint-mobile">Para a melhor experiência, use o computador ou gire o celular na horizontal.</div>

  <section class="ph-card ph-card--accent">
    <p class="ph-eyebrow">Acesso</p>
    <h1 class="ph-title">Entrar na sua conta</h1>
    <p class="ph-sub">Use seu e-mail e senha.</p>

    <hr class="ph-sep">

    <form id="form-login" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control" type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="senha">Senha</label>
        <input class="form-control" type="password" id="senha" name="senha" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit" id="btn-entrar">Entrar</button>
    </form>

    <hr class="ph-sep">

    <div class="d-flex justify-content-between flex-wrap gap-2" style="font-size:.88rem">
      <a href="esqueci-senha.html">Esqueci minha senha</a>
      <a href="cadastro.html">Criar uma conta</a>
    </div>
  </section>
</main>

<footer class="ph-footer">
  <div class="ph-footer__links">
    <a href="termos.html"><i data-lucide="file-text" aria-hidden="true"></i> Termo de Aceite</a>
    <a href="privacidade.html"><i data-lucide="shield-check" aria-hidden="true"></i> Política de Privacidade</a>
  </div>
  <p class="ph-footer__copy">Escape.py &middot; Projeto Final de Curso</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
